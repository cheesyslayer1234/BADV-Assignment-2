name: CCN Carnival Smart Contract CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run unit test suite
        run: npx hardhat test

      - name: Run coverage report
        run: npx hardhat coverage

  deploy-testnet:
    name: Deploy to Sepolia testnet
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Compile contracts
        run: npx hardhat compile

      - name: Check whether contract-relevant files changed
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manually triggered via workflow_dispatch — deploying regardless of diff."
          elif git diff --quiet HEAD^ HEAD -- contracts/ scripts/deploy.js hardhat.config.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No contract-relevant files changed in this push — skipping deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Contract-relevant files changed — deploying a new instance."
          fi

      - name: Deploy to Sepolia
        if: steps.filter.outputs.changed == 'true'
        run: npx hardhat run scripts/deploy.js --network sepolia
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

      - name: Upload deployment record
        if: steps.filter.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sepolia-deployment
          path: deployments/sepolia.json

      - name: Add deployment summary
        if: steps.filter.outputs.changed == 'true'
        run: |
          echo "### Deployed new contract to Sepolia" >> $GITHUB_STEP_SUMMARY
          cat deployments/sepolia.json >> $GITHUB_STEP_SUMMARY

      - name: Add skipped-deploy summary
        if: steps.filter.outputs.changed == 'false'
        run: |
          echo "### Deploy skipped" >> $GITHUB_STEP_SUMMARY
          echo "No contract-relevant files changed in this push, so the existing Sepolia contract was left untouched. Only the frontend/Pages site was rebuilt." >> $GITHUB_STEP_SUMMARY

      - name: Commit updated frontend config back to main
        if: steps.filter.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- frontend/js/config.js; then
            echo "config.js unchanged, nothing to commit."
          else
            git add frontend/js/config.js
            # [skip ci] stops this push from re-triggering the workflow
            # and looping back into another deploy.
            git commit -m "chore: sync frontend config to latest Sepolia deploy [skip ci]"
            git push
          fi

  deploy-pages:
    name: Publish frontend to GitHub Pages
    needs: deploy-testnet
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload frontend as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
